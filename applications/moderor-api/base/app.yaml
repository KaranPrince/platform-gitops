apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: moderor-api
  namespace: argocd
spec:
  project: moderor
  source:
    repoURL: https://github.com/KaranPrince/platform-gitops.git
    targetRevision: main
    path: applications/moderor-api/base
  destination:
    server: https://kubernetes.default.svc
    namespace: moderor-api
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true